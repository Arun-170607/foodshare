<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodShare - Available Food</title>
    <link rel="stylesheet" href="css/receiver.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <header class="topbar">
        <div class="logo-section">
            <img src="Images/Food_share logo2.png" alt="FoodShare">
            <h2>FoodShare</h2>
        </div>

        <button type="button" id="homeBtn">
            <i class="bi bi-house"></i> Home
        </button>
    </header>

    <main class="receiver-container">

        <section class="page-header">
            <h1>Available Food</h1>
            <p>Find approved surplus food available for your organization.</p>
        </section>

        <section id="foodList" class="food-grid"></section>

        <div id="emptyMessage" class="empty-message">
            <i class="bi bi-box-seam"></i>
            <h3>No Food Available</h3>
            <p>Currently there are no approved food donations available.</p>
        </div>

    </main>

    <div id="toast" class="toast">
        <span id="toastMessage"></span>
    </div>

    <script src="js/receiver.js"></script>

</body>
</html>
